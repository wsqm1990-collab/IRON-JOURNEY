<title>Iron Journey</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&display=swap">
<style>
/* Layout: phone-first single column. Sticky "quem está treinando" bar on top, one task per screen,
   tabs at the bottom. The training cycle is drawn as a loaded barbell whose plates follow
   competition plate colors (green = adaptação, blue = acumulação, red = intensificação, white = deload). */
:root{
  --bg:#E9EDF2; --surface:#FFFFFF; --surface-2:#F3F6F9; --ink:#111A24; --muted:#556274; --line:#D2D9E1;
  --accent:#1C58D2; --accent-ink:#FFFFFF; --accent-soft:#E1E9FA;
  --ok:#1C8A4C; --ok-soft:#DCF1E4; --warn:#9A6A00; --warn-soft:#FAEFD0; --danger:#BF3328; --danger-soft:#F8E0DC;
  --plate-green:#2C9655; --plate-blue:#1C58D2; --plate-red:#CF372B; --plate-yellow:#E0A915; --plate-white:#F6F8FA;
  --plate-edge:#8C99A7; --bar:#8F9BA8; --scrim:rgba(10,16,24,.45);
  --fig-n:#2D4053; --fig-f:#9AA8B7; --fig-eq:#6C7A89; --fig-eqf:#A9B4C0; --fig-pl:#3B4752; --fig-pd:#C6CFD8; --fig-pd2:#AEB9C4; --fig-sh:rgba(17,26,36,.09); --fig-bd:#D9473B;
  --f-display:"Big Shoulders Display","Barlow Condensed","Arial Narrow",sans-serif;
  --f-cond:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --t-xs:12px; --t-sm:14px; --t-md:16px; --t-lg:20px; --t-xl:28px; --t-2xl:40px;
  --r:14px; --tab-h:64px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1217; --surface:#161C23; --surface-2:#1C232C; --ink:#E6EBF0; --muted:#98A5B3; --line:#29323C;
    --accent:#6E9DF6; --accent-ink:#0A1220; --accent-soft:#1A2943;
    --ok:#4FC283; --ok-soft:#14301F; --warn:#E5B544; --warn-soft:#352B10; --danger:#F07468; --danger-soft:#3A1B18;
    --plate-green:#3DB06A; --plate-blue:#4F84EE; --plate-red:#E5544A; --plate-yellow:#E8B83A; --plate-white:#C8D0D9;
    --plate-edge:#5E6B79; --bar:#6C7887; --scrim:rgba(0,0,0,.6);
    --fig-n:#D6DEE6; --fig-f:#6B7989; --fig-eq:#9AA6B2; --fig-eqf:#56636F; --fig-pl:#A3AFBB; --fig-pd:#3D4855; --fig-pd2:#323C47; --fig-sh:rgba(0,0,0,.35); --fig-bd:#F07468;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1217; --surface:#161C23; --surface-2:#1C232C; --ink:#E6EBF0; --muted:#98A5B3; --line:#29323C;
  --accent:#6E9DF6; --accent-ink:#0A1220; --accent-soft:#1A2943;
  --ok:#4FC283; --ok-soft:#14301F; --warn:#E5B544; --warn-soft:#352B10; --danger:#F07468; --danger-soft:#3A1B18;
  --plate-green:#3DB06A; --plate-blue:#4F84EE; --plate-red:#E5544A; --plate-yellow:#E8B83A; --plate-white:#C8D0D9;
  --plate-edge:#5E6B79; --bar:#6C7887; --scrim:rgba(0,0,0,.6);
    --fig-n:#D6DEE6; --fig-f:#6B7989; --fig-eq:#9AA6B2; --fig-eqf:#56636F; --fig-pl:#A3AFBB; --fig-pd:#3D4855; --fig-pd2:#323C47; --fig-sh:rgba(0,0,0,.35); --fig-bd:#F07468;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:var(--t-md);line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;line-height:1}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:11px;letter-spacing:.08em;color:var(--muted)}
.people{display:flex;gap:6px;margin-left:auto;overflow-x:auto;scrollbar-width:none;min-width:0}
.people::-webkit-scrollbar{display:none}
.who{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px 4px 4px;font-weight:600;font-size:var(--t-sm);white-space:nowrap;min-height:36px}
.who[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.who .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--f-cond);font-size:15px;font-weight:700;border:2px solid rgba(255,255,255,.35)}
.who.add{padding:4px 12px;color:var(--muted)}

main{padding-block:16px calc(var(--tab-h) + 120px + env(safe-area-inset-bottom,0px))}
.screen{display:flex;flex-direction:column;gap:16px}

/* type */
h1,h2,h3{margin:0;text-wrap:balance}
.h-display{font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:.95}
.h1{font-size:var(--t-2xl)} .h2{font-size:var(--t-xl)} .h3{font-family:var(--f-cond);font-weight:700;font-size:var(--t-lg);line-height:1.15}
.eyebrow{font-size:var(--t-xs);font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:var(--t-sm)} .xs{font-size:var(--t-xs)}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.lead{font-size:17px;color:var(--muted);max-width:60ch}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:1px solid transparent;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:var(--t-md);text-decoration:none}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.quiet{background:transparent;color:var(--accent);border-color:transparent;padding:0 10px}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.ok{background:var(--ok);color:#fff}
.btn.small{min-height:38px;padding:0 12px;font-size:var(--t-sm);border-radius:10px}
.btn.block{width:100%}
.btn.big{min-height:58px;font-size:18px;font-family:var(--f-cond);letter-spacing:.03em;text-transform:uppercase}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* chips & options */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:var(--t-sm);font-weight:600;min-height:40px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 16px}
.opt b{font-size:17px}
.opt span{color:var(--muted);font-size:var(--t-sm)}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;min-height:46px;font-weight:700;font-family:var(--f-cond);font-size:18px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* fields */
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:var(--t-sm)}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:var(--t-md);min-height:48px}
textarea.inp{min-height:96px;resize:vertical;line-height:1.4}
.inp::placeholder{color:var(--muted);opacity:.8}

/* panels */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:16px}
.note{border-radius:12px;padding:12px 14px;font-size:var(--t-sm);background:var(--surface-2);border:1px solid var(--line)}
.note.warn{background:var(--warn-soft);border-color:transparent;color:var(--ink)}
.note.err{background:var(--danger-soft);border-color:transparent}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 9px;font-size:var(--t-xs);font-weight:700;letter-spacing:.02em;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.pill.acc{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.pill.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.pill.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.pill.pr{background:var(--plate-yellow);border-color:transparent;color:#1A1400}
hr.sep{border:0;border-top:1px solid var(--line);margin:0}

/* hero (today) */
.hero{display:flex;flex-direction:column;gap:12px;padding:18px 16px;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.hero .h1{font-size:clamp(34px,10vw,46px)}
.bar-svg{width:100%;height:auto;display:block;max-width:100%}
.dots{display:flex;gap:6px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--plate-edge)}
.dot.on{background:var(--ok);border-color:var(--ok)}

/* exercise list (plan / preview) */
.exlist{display:flex;flex-direction:column}
.exitem{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.exitem:first-child{border-top:0}
.exitem .nm{font-weight:600;min-width:0}
.exitem .mt{font-size:var(--t-sm);color:var(--muted);grid-column:1/2}
.exitem .sg{font-family:var(--f-cond);font-weight:700;font-size:18px;text-align:right;white-space:nowrap}

/* workout */
.wk-head{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:20;background:var(--bg);padding-block:8px;margin-top:-8px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.wk-head .t{min-width:0;flex:1}
.wk-head .t b{display:block;font-family:var(--f-cond);font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex{display:flex;flex-direction:column;gap:10px;padding:14px}
.ex.done{border-color:var(--ok)}
.ex.skip{opacity:.6}
.ex-top{display:flex;gap:10px;align-items:flex-start}
.ex-top .nm{flex:1;min-width:0}
.ex-top .nm .h3{overflow-wrap:anywhere}
.target{display:flex;flex-wrap:wrap;gap:6px}
.sugg{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:var(--t-sm)}
.sugg b{font-family:var(--f-cond);font-size:20px}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:30px 1fr 1fr 52px;gap:8px;align-items:center}
.set .n{font-family:var(--f-cond);font-weight:700;font-size:18px;color:var(--muted);text-align:center}
.set input{width:100%;min-width:0;text-align:center;font-family:var(--f-cond);font-weight:700;font-size:22px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;min-height:48px;font-variant-numeric:tabular-nums}
.set .ck{min-height:48px;border-radius:10px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center}
.set.ok input{background:var(--ok-soft);border-color:transparent}
.set.ok .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.set-h{display:grid;grid-template-columns:30px 1fr 1fr 52px;gap:8px;font-size:var(--t-xs);font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;text-align:center}
.ex-actions{display:flex;gap:6px;flex-wrap:wrap}
.tip{font-size:var(--t-sm);color:var(--muted);border-left:3px solid var(--plate-yellow);padding-left:10px}

/* rest bar */
.rest{position:fixed;left:0;right:0;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));z-index:25;pointer-events:none}
.rest .wrap{padding-block:8px}
.rest-in{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.rest-in.go{background:var(--ok);color:#fff}
.rest-in .clock{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1;min-width:84px;font-variant-numeric:tabular-nums}
.rest-in .lbl{flex:1;min-width:0;font-size:var(--t-sm);line-height:1.25}
.rest-in button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:10px;min-height:40px;min-width:44px;font-weight:700;padding:0 8px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr);height:var(--tab-h)}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}
.tab .live{width:7px;height:7px;border-radius:50%;background:var(--plate-red);display:inline-block;margin-left:3px;vertical-align:middle}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim)}
.sheet-p{width:100%;max-width:600px;max-height:90dvh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet-p .wrap{display:flex;flex-direction:column;gap:14px;padding-block:8px 8px}
.sheet-h{position:sticky;top:0;background:var(--bg);z-index:2;padding-top:8px}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet-h .row{flex-wrap:nowrap}
.sheet-h h2{flex:1;min-width:0}
.x{border:1px solid var(--line);background:var(--surface);border-radius:50%;width:40px;height:40px;display:grid;place-items:center;flex:none}

/* coach */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;line-height:1.45;overflow-wrap:anywhere}
.msg.a{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px;align-self:flex-start}
.msg.u{background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px;align-self:flex-end;white-space:pre-wrap}
.msg p+p,.msg ul+p,.msg p+ul{margin-top:8px}
.msg ul{margin:0;padding-left:20px}
.msg.think{color:var(--muted);font-style:italic}
.composer{position:fixed;left:0;right:0;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));z-index:25;background:var(--bg);border-top:1px solid var(--line)}
.composer .wrap{display:flex;gap:8px;padding-block:8px;align-items:flex-end}
.composer textarea{flex:1;min-height:48px;max-height:140px;resize:none}
.md p+p,.md p+ul,.md ul+p,.md p+ol,.md ol+p{margin-top:8px}
.md ul,.md ol{margin:0;padding-left:22px}.md li+li{margin-top:3px}
.md h4{margin:10px 0 4px;font-family:var(--f-cond);font-size:18px}

/* progress */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1}
.stat span{font-size:var(--t-xs);color:var(--muted);font-weight:600}
.prog{display:grid;grid-template-columns:1fr 96px;gap:4px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.prog:first-child{border-top:0}
.prog .spark{grid-row:1/3;grid-column:2}
.sess{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.sess:first-child{border-top:0}

/* loader: plates sliding onto a bar */
.loader{display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px 0;text-align:center}
.lbar{position:relative;width:240px;max-width:100%;height:84px}
.lbar .shaft{position:absolute;left:0;right:0;top:39px;height:6px;border-radius:3px;background:var(--bar)}
.lbar .pl{position:absolute;top:50%;width:16px;border-radius:4px;transform:translate(0,-50%);animation:load 3.2s ease-in-out infinite}
@keyframes load{0%{opacity:0;transform:translate(60px,-50%)}18%,80%{opacity:1;transform:translate(0,-50%)}100%{opacity:0;transform:translate(0,-50%)}}
@media (prefers-reduced-motion: reduce){.lbar .pl{animation:none}}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + 86px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:var(--t-sm);max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25)}

.banner{font-size:var(--t-sm);padding:10px 14px;border-radius:12px;background:var(--warn-soft)}
.center{text-align:center}
.spacer{height:4px}
.equip-group{display:flex;flex-direction:column;gap:10px}
details.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.box>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px;font-weight:700}
details.box>summary::-webkit-details-marker{display:none}
details.box>summary::after{content:"+";margin-left:auto;font-family:var(--f-cond);font-size:22px;color:var(--muted)}
details.box[open]>summary::after{content:"–"}
details.box .in{padding:0 16px 16px}
@media (min-width:600px){ .hero{padding:24px} }
</style>
